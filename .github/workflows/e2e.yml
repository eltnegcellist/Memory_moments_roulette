name: E2E audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 17 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Smoke on PR and main
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: npm run test:e2e:smoke
      - name: Full implemented suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
